<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>writing.com archival</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif}header{padding:20px 24px;border-bottom:1px solid #30363d;position:sticky;top:0;background:#0d1117ee;backdrop-filter:blur(8px);z-index:2}h1{margin:0 0 4px;font-size:22px}p{margin:0;color:#8b949e}main{display:grid;grid-template-columns:370px 1fr;min-height:calc(100vh - 86px)}aside{border-right:1px solid #30363d;padding:14px;overflow:auto}input{width:100%;padding:10px 12px;border:1px solid #30363d;border-radius:8px;background:#161b22;color:#e6edf3}ul{list-style:none;padding:10px 0;margin:0}li{margin:2px 0}button{width:100%;text-align:left;padding:9px 10px;border:0;border-radius:6px;background:transparent;color:#c9d1d9;cursor:pointer;font-family:inherit}button:hover,button.active{background:#21262d;color:#fff}.size{float:right;color:#6e7681;font-size:12px}section{padding:20px;min-width:0}#path{color:#8b949e;margin-bottom:12px;word-break:break-all}pre{margin:0;padding:18px;background:#161b22;border:1px solid #30363d;border-radius:8px;white-space:pre-wrap;overflow:auto;max-height:calc(100vh - 150px);font:13px ui-monospace,monospace}iframe{width:100%;height:calc(100vh - 150px);border:1px solid #30363d;border-radius:8px;background:white}.notice{padding:16px;border:1px solid #30363d;border-radius:8px;color:#8b949e}@media(max-width:800px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #30363d;max-height:40vh}}</style></head><body><header><h1>writing.com archival</h1><p>Przeglądarka całej zawartości archiwum · <span id="count"></span></p></header><main><aside><input id="search" placeholder="Szukaj pliku…"><ul id="list"></ul></aside><section><div id="path">Wybierz plik z lewej strony.</div><div id="viewer" class="notice">Kliknij plik, aby zobaczyć jego zawartość.</div></section></main><script>const files=[{"path": "writing.com-archival/.dockerignore", "size": 66}, {"path": "writing.com-archival/.gitignore", "size": 1159}, {"path": "writing.com-archival/Dockerfile", "size": 98}, {"path": "writing.com-archival/README.md", "size": 4398}, {"path": "writing.com-archival/archiver.py", "size": 11861}, {"path": "writing.com-archival/config.yaml", "size": 154}, {"path": "writing.com-archival/defs.py", "size": 986}, {"path": "writing.com-archival/docker-compose.yml", "size": 221}, {"path": "writing.com-archival/htmlformat.py", "size": 137}, {"path": "writing.com-archival/requirements-android.txt", "size": 203}, {"path": "writing.com-archival/requirements.txt", "size": 227}, {"path": "writing.com-archival/run.py", "size": 2015}, {"path": "writing.com-archival/scraper.py", "size": 14890}, {"path": "writing.com-archival/session.py", "size": 7174}, {"path": "writing.com-archival/writing.html", "size": 32659}];const list=document.getElementById('list'),search=document.getElementById('search'),viewer=document.getElementById('viewer'),pathEl=document.getElementById('path');document.getElementById('count').textContent=files.length+' plików';function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}function render(q=''){list.innerHTML='';files.filter(f=>f.path.toLowerCase().includes(q.toLowerCase())).forEach(f=>{let li=document.createElement('li'),b=document.createElement('button');b.innerHTML=esc(f.path)+' <span class="size">'+size(f.size)+'</span>';b.onclick=()=>openFile(f,b);li.appendChild(b);list.appendChild(li)})}function openFile(f,b){document.querySelectorAll('button.active').forEach(x=>x.classList.remove('active'));b.classList.add('active');pathEl.textContent=f.path;let ext=f.path.split('.').pop().toLowerCase();if(ext==='html'||ext==='htm')viewer.innerHTML='<iframe src="'+encodeURI(f.path)+'" sandbox="allow-scripts allow-same-origin"></iframe>';else fetch(encodeURI(f.path)).then(r=>r.text()).then(t=>viewer.innerHTML='<pre>'+esc(t)+'</pre>').catch(()=>viewer.innerHTML='<div class="notice">Nie można wyświetlić tego pliku bezpośrednio w przeglądarce.</div>')}search.oninput=()=>render(search.value);render();</script></body></html>
